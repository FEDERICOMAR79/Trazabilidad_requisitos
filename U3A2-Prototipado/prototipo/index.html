<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipo — Asignación de tripulaciones</title>
<style>
:root{--ink:#222;--mut:#666;--line:#8a8a8a;--bg:#fff;--soft:#f1f1f1;--warn:#fff3c4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{border-bottom:2px solid var(--ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header h1{font-size:16px;margin:0}
.tag{border:1.5px dashed var(--line);padding:1px 8px;font-size:12px;color:var(--mut)}
label{font-size:13px;color:var(--mut)}
select,input,textarea,button{font:inherit}
select,input,textarea{border:1.5px solid var(--ink);padding:6px 8px;background:#fff;color:var(--ink);max-width:100%}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1.5px dashed var(--line)}
nav a{border:1.5px solid var(--ink);padding:6px 12px;text-decoration:none;color:var(--ink)}
nav a[aria-current=page]{background:var(--ink);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:6px 0 12px}h3{font-size:16px;margin:18px 0 8px}
.box{border:2px dashed var(--line);padding:12px;margin:10px 0;background:#fff}
.box.hl{border:2.5px solid var(--ink);background:var(--soft)}
.warn{background:var(--warn);border:1.5px solid #b59b2a;padding:8px 10px;margin:8px 0}
.err{color:#9b1c1c;font-size:13px;margin-top:4px}
table{width:100%;border-collapse:collapse}th,td{border:1.5px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
tr.rec td{background:var(--soft);font-weight:600}
.btn{border:2px solid var(--ink);background:#fff;color:var(--ink);padding:7px 14px;cursor:pointer;display:inline-block;text-decoration:none}
.btn.pri{background:var(--ink);color:#fff}
.btn:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #1a5fd0;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ph{height:70px;border:1.5px dashed var(--line);background:repeating-linear-gradient(45deg,#fafafa,#fafafa 8px,#eee 8px,#eee 16px);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:0 8px;font-size:12px;margin-left:6px}
.chip.on{background:var(--ink);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}
.row>div{display:flex;flex-direction:column;gap:3px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;display:none;max-width:90vw;z-index:20}
dialog{border:2.5px solid var(--ink);padding:16px;max-width:520px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.45)}
.small{font-size:13px;color:var(--mut)}
.scroll{overflow-x:auto}
.cop-m{display:none}
/* @trace RNF-06 | Estilos para pantallas móviles */
@media (max-width:600px){main{padding:10px}th,td{padding:5px 6px;font-size:14px}.grid{grid-template-columns:1fr 1fr}.hide-m{display:none}.cop-m{display:block;font-size:13px;color:var(--mut);font-weight:400}.btn{padding:7px 10px}}
</style>
</head>
<body>
<header>
  <h1>Sistema de asignación de tripulaciones</h1>
  <span class="tag">PROTOTIPO · baja fidelidad · datos simulados</span>
  <span><label for="rol">Rol (simulado)</label>
  <select id="rol"><option value="operador">Operador de vuelos</option><option value="tripulante">Piloto / copiloto</option><option value="admin">Personal administrativo</option></select></span>
  <span id="quien-wrap" hidden><label for="quien">Soy</label> <select id="quien"></select></span>
  <button class="btn" id="reset" type="button" title="Restablece los datos de demostración">Restablecer datos</button>
</header>
<nav id="nav" aria-label="Navegación principal"></nav>
<main id="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>

<script>
"use strict";
/* ---------- Datos simulados ---------- */
const ESCENARIOS=[
 {id:"E1",nombre:"Cielo despejado y relieve plano",vis:1,met:1,rel:1},
 {id:"E2",nombre:"Niebla densa en valle",vis:8,met:2,rel:5},
 {id:"E3",nombre:"Tormenta eléctrica",vis:5,met:9,rel:3},
 {id:"E4",nombre:"Relieve montañoso con viento",vis:2,met:5,rel:9},
 {id:"E5",nombre:"Lluvia y turbulencia moderada",vis:4,met:6,rel:2},
 {id:"E6",nombre:"Noche con niebla y montaña",vis:9,met:3,rel:8}
];
const PESO={vis:0.4,met:0.4,rel:0.2};
const TRIPULACIONES=[
 {id:"T1",piloto:"Cap. Andrés Salazar",copiloto:"Of. Santiago Mejía"},
 {id:"T2",piloto:"Cap. Marcela Ortiz",copiloto:"Of. Daniela Arias"},
 {id:"T3",piloto:"Cap. Julián Restrepo",copiloto:"Of. Mateo Giraldo"},
 {id:"T4",piloto:"Cap. Paula Londoño",copiloto:"Of. Valentina Ríos"},
 {id:"T5",piloto:"Cap. Camilo Vélez",copiloto:"Of. Sara Zapata"}
];
const VUELOS=[
 {id:"V101",fecha:"2026-11-15",origen:"Medellín (MDE)",destino:"Bogotá (BOG)",clima:"Nubosidad parcial, viento moderado",vis:2,met:3,rel:5,visT:"Buena (10 km)",relT:"Cordillera central"},
 {id:"V102",fecha:"2026-11-16",origen:"Bogotá (BOG)",destino:"Cartagena (CTG)",clima:"Tormentas aisladas por la tarde",vis:1,met:6,rel:1,visT:"Buena (10 km)",relT:"Plano"},
 {id:"V103",fecha:"2026-11-17",origen:"Cali (CLO)",destino:"Medellín (MDE)",clima:"Niebla matinal, lluvia ligera",vis:7,met:4,rel:7,visT:"Reducida (2 km)",relT:"Valles y cordillera"},
 {id:"V104",fecha:"2026-11-18",origen:"Bogotá (BOG)",destino:"Quito (UIO)",clima:"Tormenta eléctrica prevista",vis:5,met:9,rel:8,visT:"Variable (4 km)",relT:"Cordillera de los Andes"},
 {id:"V105",fecha:"2026-11-19",origen:"Cartagena (CTG)",destino:"Ciudad de Panamá (PTY)",clima:"Despejado, viento leve",vis:1,met:2,rel:1,visT:"Excelente (15 km)",relT:"Plano"},
 {id:"V106",fecha:"2026-11-20",origen:"Medellín (MDE)",destino:"Miami (MIA)",clima:"Nubosidad parcial",vis:2,met:3,rel:1,visT:"Buena (10 km)",relT:"Plano"}
];
// resultados vigentes por piloto (T*) y escenario, con fecha; historial aparte
const RESULTADOS0={
 T1:{E1:[92,"2026-02-10"],E2:[71,"2026-03-04"],E3:[88,"2026-05-12"],E4:[64,"2026-06-01"],E5:[80,"2026-02-20"],E6:[58,"2026-07-02"]},
 T2:{E1:[85,"2026-02-11"],E2:[90,"2026-03-05"],E3:[88,"2026-05-13"],E4:[77,"2026-06-02"],E5:[83,"2026-02-21"],E6:[81,"2026-07-03"]},
 T3:{E1:[78,"2026-02-12"],E2:[66,"2026-03-06"],E3:[74,"2026-05-14"],E4:[93,"2026-06-03"],E5:[70,"2026-02-22"],E6:[89,"2026-07-04"]},
 T4:{E1:[88,"2026-02-13"],E2:[84,"2026-03-07"],E3:[69,"2026-05-15"],E4:[72,"2026-06-04"],E5:[91,"2026-02-23"],E6:[76,"2026-07-05"]},
 T5:{E1:[74,"2026-02-14"],E2:[79,"2026-03-08"],E3:[82,"2026-05-16"],E4:[85,"2026-06-05"],E5:[75,"2026-02-24"],E6:[94,"2026-07-06"]}
};
const LS="tri-proto-v1";
function inicial(){return{resultados:JSON.parse(JSON.stringify(RESULTADOS0)),historial:{},asignaciones:{V106:{tripulacion:"T2",escenario:"E1",motivo:"",quien:"Operador (datos de ejemplo)",cuando:"2026-10-01 09:00"}},auditoria:[]}}
let S;
try{S=JSON.parse(localStorage.getItem(LS)||"null")}catch(e){S=null}
if(!S)S=inicial();
function guardar(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>{const [y,m,dd]=d.split("-");return dd+"/"+m+"/"+y};
const trip=id=>TRIPULACIONES.find(t=>t.id===id);
const esc_=id=>ESCENARIOS.find(e=>e.id===id);
function toast(msg){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",4200)}
/* @trace HU-07 */ function distancia(v,e){return Math.sqrt(PESO.vis*(v.vis-e.vis)**2+PESO.met*(v.met-e.met)**2+PESO.rel*(v.rel-e.rel)**2)}
/* @trace HU-07 */ function masCercano(v){return ESCENARIOS.map(e=>({e,d:distancia(v,e)})).sort((a,b)=>a.d-b.d)[0]}
/* @trace HU-07 */ function ranking(esId){
  return TRIPULACIONES.map(t=>({t,punt:S.resultados[t.id][esId][0],fecha:S.resultados[t.id][esId][1]})).sort((a,b)=>b.punt-a.punt||a.t.id.localeCompare(b.t.id));
}

/* ---------- Navegación y roles ---------- */
/* @trace RNF-01 */ const NAV={
 operador:[["#/vuelos","Vuelos"],["#/auditoria","Historial de asignaciones"]],
 tripulante:[["#/mis-vuelos","Mis vuelos"],["#/todos","Todos los vuelos"],["#/evaluacion","Escenarios y mi evaluación"]],
 admin:[["#/resultado","Registrar resultado de simulación"]]
};
let rol=sessionStorage.getItem("tri-rol")||"operador";
let miembro=null;
function miembros(){const l=[];TRIPULACIONES.forEach(t=>{l.push({k:t.id+":p",n:t.piloto,t:t.id,p:true});l.push({k:t.id+":c",n:t.copiloto,t:t.id,p:false})});return l}
function montarMiembros(){const s=$("#quien");s.innerHTML=miembros().map(m=>`<option value="${m.k}">${esc(m.n)}</option>`).join("");miembro=s.value}
/* @trace RNF-01 */ function permitido(h){return NAV[rol].some(n=>h.startsWith(n[0]))||(rol==="operador"&&h.startsWith("#/vuelo/"))||(rol==="tripulante"&&h.startsWith("#/vuelo/"))}
function pintarNav(){
  const h=location.hash||"";
  $("#nav").innerHTML=NAV[rol].map(([href,txt])=>`<a href="${href}"${h===href||(href==="#/vuelos"&&h.startsWith("#/vuelo/")&&rol==="operador")||(href==="#/mis-vuelos"&&h.startsWith("#/vuelo/")&&rol==="tripulante")?' aria-current="page"':""}>${txt}</a>`).join("");
  $("#quien-wrap").hidden=rol!=="tripulante";
}
$("#rol").value=rol;
$("#rol").addEventListener("change",e=>{rol=e.target.value;sessionStorage.setItem("tri-rol",rol);location.hash=NAV[rol][0][0];route()});
$("#quien").addEventListener("change",e=>{miembro=e.target.value;route()});
$("#reset").addEventListener("click",()=>{
 const d=$("#dlg"),f=$("#dlg-form");
 f.innerHTML=`<h3 style="margin-top:0">¿Restablecer los datos de demostración?</h3><p>Se borrarán las asignaciones, los resultados registrados y el historial de esta sesión.</p>
 <div class="row"><button class="btn pri" type="button" id="rok">Sí, restablecer</button><button class="btn" type="button" id="rno">Cancelar</button></div>`;
 d.showModal();$("#rno").onclick=()=>d.close();
 $("#rok").onclick=()=>{S=inicial();selEsc={};guardar();d.close();toast("Datos de demostración restablecidos");route()};
});
montarMiembros();
window.addEventListener("hashchange",route);

/* ---------- Vistas ---------- */
/* @trace HU-05 */ function fichaVuelo(v){
 return `<div class="grid">
  <div class="box"><b>Fecha</b><br>${fmt(v.fecha)}</div>
  <div class="box"><b>Origen</b><br>${esc(v.origen)}</div>
  <div class="box"><b>Destino</b><br>${esc(v.destino)}</div></div>
  <div class="grid">
  <div class="box"><b>Meteorología prevista</b><br>${esc(v.clima)}</div>
  <div class="box"><b>Visibilidad prevista</b><br>${esc(v.visT)}</div>
  <div class="box"><b>Relieve de la ruta</b><br>${esc(v.relT)}</div></div>`;
}
function estadoVuelo(id){const a=S.asignaciones[id];return a?`Asignado a ${esc(trip(a.tripulacion).piloto)} y ${esc(trip(a.tripulacion).copiloto)}`:"Sin asignar"}

/* @trace HU-08 */ function vVuelos(){
 return `<h2>Vuelos</h2><p class="small">Elige un vuelo para ver sus características, el escenario más aproximado y la tripulación recomendada.</p>
 <div class="scroll"><table><thead><tr><th>Vuelo</th><th>Fecha</th><th>Ruta</th><th>Estado</th><th></th></tr></thead><tbody>
 ${VUELOS.map(v=>`<tr><td>${v.id}</td><td>${fmt(v.fecha)}</td><td>${esc(v.origen)} → ${esc(v.destino)}</td><td>${S.asignaciones[v.id]?"<b>Asignado</b>":"Sin asignar"}</td>
 <td><a class="btn${S.asignaciones[v.id]?"":" pri"}" href="#/vuelo/${v.id}">${S.asignaciones[v.id]?"Ver":"Asignar"}</a></td></tr>`).join("")}
 </tbody></table></div>`;
}

let selEsc={};
/* @trace HU-05 HU-07 HU-08 */ function vVueloOperador(id){
 const v=VUELOS.find(x=>x.id===id);if(!v)return"<h2>Vuelo no encontrado</h2><a class='btn' href='#/vuelos'>Volver</a>";
 const mc=masCercano(v);const esId=selEsc[id]||mc.e.id;const es=esc_(esId);const rk=ranking(esId);
 const top=rk[0].punt;const empatados=rk.filter(r=>r.punt===top);
 const asg=S.asignaciones[id];
 return `<p><a href="#/vuelos">← Volver a vuelos</a></p><h2>Vuelo ${v.id} · ${esc(v.origen)} → ${esc(v.destino)}</h2>
 ${fichaVuelo(v)}
 <h3>1. Escenario más aproximado</h3>
 <div class="box hl"><b>Sugerido por el sistema: ${mc.e.id} · ${esc(mc.e.nombre)}</b>
  <div class="small">Diferencia con las condiciones previstas: ${mc.d.toFixed(1)} (menor es más parecido). Compara visibilidad, meteorología y relieve.</div></div>
 <div class="row"><div><label for="esc">Escenario que usarás (puedes cambiarlo)</label>
  <select id="esc">${ESCENARIOS.map(e=>`<option value="${e.id}"${e.id===esId?" selected":""}>${e.id} · ${esc(e.nombre)}${e.id===mc.e.id?" (sugerido)":""}</option>`).join("")}</select></div></div>
 <h3>2. Tripulaciones según su puntuación en ${es.id}</h3>
 ${empatados.length>1?`<div class="warn"><b>Empate en la puntuación más alta (${top}).</b> Elige con tu criterio y escribe el motivo.</div>`:""}
 ${asg?`<div class="warn">Este vuelo ya está asignado a ${esc(trip(asg.tripulacion).piloto)}. Si asignas otra tripulación, se registrará como reasignación.</div>`:""}
 <div class="scroll"><table><thead><tr><th>#</th><th>Piloto</th><th class="hide-m">Copiloto</th><th>Puntuación en ${es.id}</th><th class="hide-m">Última simulación</th><th></th></tr></thead><tbody>
 ${rk.map((r,i)=>`<tr class="${r.punt===top?"rec":""}"><td>${i+1}</td><td>${esc(r.t.piloto)}${r.punt===top?'<span class="chip on">Recomendada</span>':""}<span class="cop-m">Copiloto: ${esc(r.t.copiloto)}</span></td><td class="hide-m">${esc(r.t.copiloto)}</td><td>${r.punt}</td><td class="hide-m">${fmt(r.fecha)}</td>
 <td><button class="btn${r.punt===top?" pri":""}" data-asignar="${r.t.id}" type="button">Asignar</button></td></tr>`).join("")}
 </tbody></table></div>`;
}
/* @trace HU-08 RNF-02 */ function abrirConfirmar(vId,tId){
 const v=VUELOS.find(x=>x.id===vId);const mc=masCercano(v);const esId=selEsc[vId]||mc.e.id;const rk=ranking(esId);const top=rk[0].punt;
 const r=rk.find(x=>x.t.id===tId);const noTop=r.punt<top;
 const d=$("#dlg"),f=$("#dlg-form");
 f.innerHTML=`<h3 style="margin-top:0">Confirmar asignación</h3>
 <p>Vuelo <b>${v.id}</b> (${fmt(v.fecha)}) · escenario <b>${esId}</b><br>Tripulación: <b>${esc(r.t.piloto)}</b> y <b>${esc(r.t.copiloto)}</b> (puntuación ${r.punt}).</p>
 ${noTop?`<div class="warn">Esta tripulación <b>no es la de mayor puntuación</b> (${top}). Explica el motivo para dejar constancia.</div>
 <label for="motivo">Motivo de la decisión (obligatorio)</label><textarea id="motivo" rows="3" style="width:100%"></textarea><div id="merr" class="err" role="alert"></div>`:""}
 <div class="row"><button class="btn pri" type="button" id="ok">Confirmar asignación</button><button class="btn" type="button" id="no">Cancelar</button></div>`;
 d.showModal();
 $("#no").onclick=()=>d.close();
 $("#ok").onclick=()=>{
  let motivo="";
  if(noTop){motivo=$("#motivo").value.trim();if(motivo.length<10){$("#merr").textContent="Escribe un motivo de al menos 10 caracteres.";$("#motivo").focus();return}}
  const prev=S.asignaciones[vId];
  const ahora=new Date();const cuando=ahora.getFullYear()+"-"+String(ahora.getMonth()+1).padStart(2,"0")+"-"+String(ahora.getDate()).padStart(2,"0")+" "+String(ahora.getHours()).padStart(2,"0")+":"+String(ahora.getMinutes()).padStart(2,"0");
  S.asignaciones[vId]={tripulacion:tId,escenario:esId,motivo,quien:"Operador de vuelos",cuando};
  S.auditoria.unshift({vuelo:vId,tipo:prev?"Reasignación":"Asignación",anterior:prev?prev.tripulacion:"—",nuevo:tId,escenario:esId,motivo,quien:"Operador de vuelos",cuando});
  guardar();d.close();toast("Asignación guardada. Se notificará a la tripulación (simulado).");location.hash="#/vuelos";route();
 };
}
/* @trace RNF-02 */ function vAuditoria(){
 return `<h2>Historial de asignaciones</h2><p class="small">Registro de cada asignación o reasignación hecha en esta sesión.</p>
 ${S.auditoria.length?`<div class="scroll"><table><thead><tr><th>Fecha y hora</th><th>Vuelo</th><th>Tipo</th><th>Tripulación anterior → nueva</th><th>Escenario</th><th>Motivo</th><th>Usuario</th></tr></thead><tbody>
 ${S.auditoria.map(a=>`<tr><td>${esc(a.cuando)}</td><td>${a.vuelo}</td><td>${a.tipo}</td><td>${a.anterior==="—"?"—":esc(trip(a.anterior).piloto)} → ${esc(trip(a.nuevo).piloto)}</td><td>${a.escenario}</td><td>${esc(a.motivo||"—")}</td><td>${esc(a.quien)}</td></tr>`).join("")}</tbody></table></div>`
 :`<div class="box">Todavía no hay asignaciones registradas. Asigna un vuelo desde «Vuelos».</div>`}`;
}
function miTrip(){const m=miembros().find(x=>x.k===miembro);return m}
/* @trace HU-04 */ function vMisVuelos(){
 const m=miTrip();const mis=VUELOS.filter(v=>S.asignaciones[v.id]&&S.asignaciones[v.id].tripulacion===m.t).sort((a,b)=>a.fecha.localeCompare(b.fecha));
 return `<h2>Mis vuelos</h2><p class="small">Vuelos asignados a tu tripulación, ordenados por fecha.</p>
 ${mis.length?`<div class="scroll"><table><thead><tr><th>Fecha</th><th>Vuelo</th><th>Ruta</th><th></th></tr></thead><tbody>${mis.map(v=>`<tr><td>${fmt(v.fecha)}</td><td>${v.id}</td><td>${esc(v.origen)} → ${esc(v.destino)}</td><td><a class="btn" href="#/vuelo/${v.id}">Ver detalle</a></td></tr>`).join("")}</tbody></table></div>`
 :`<div class="box">No tienes vuelos asignados por ahora.</div>`}`;
}
/* @trace HU-05 */ function vTodos(){
 return `<h2>Todos los vuelos</h2><p class="small">Puedes consultar las características de cualquier vuelo, esté asignado a ti o no.</p>
 <div class="scroll"><table><thead><tr><th>Fecha</th><th>Vuelo</th><th>Ruta</th><th></th></tr></thead><tbody>${VUELOS.map(v=>`<tr><td>${fmt(v.fecha)}</td><td>${v.id}</td><td>${esc(v.origen)} → ${esc(v.destino)}</td><td><a class="btn" href="#/vuelo/${v.id}">Ver detalle</a></td></tr>`).join("")}</tbody></table></div>`;
}
/* @trace HU-05 */ function vVueloTripulante(id){
 const v=VUELOS.find(x=>x.id===id);if(!v)return"<h2>Vuelo no encontrado</h2>";
 return `<p><a href="#/mis-vuelos">← Volver</a></p><h2>Vuelo ${v.id} · ${esc(v.origen)} → ${esc(v.destino)}</h2>${fichaVuelo(v)}<div class="box"><b>Estado:</b> ${estadoVuelo(v.id)}</div>`;
}
function vEvaluacion(){
 const m=miTrip();
 const lista=`<h3>Escenarios estándar</h3><div class="scroll"><table><thead><tr><th>ID</th><th>Escenario</th><th>Visibilidad</th><th>Meteorología</th><th>Relieve</th>${m.p?"<th>Mi puntuación</th><th>Fecha</th>":""}</tr></thead><tbody>
 ${ESCENARIOS.map(e=>`<tr><td>${e.id}</td><td>${esc(e.nombre)}</td><td>${e.vis}</td><td>${e.met}</td><td>${e.rel}</td>${m.p?`<td><b>${S.resultados[m.t][e.id][0]}</b></td><td>${fmt(S.resultados[m.t][e.id][1])}</td>`:""}</tr>`).join("")}</tbody></table></div>
 <p class="small">Los valores de visibilidad, meteorología y relieve indican la dificultad de 0 a 10.</p>`;

 $("#app").innerHTML=html;pintarNav();
 const e=$("#esc");if(e)e.addEventListener("change",ev=>{selEsc[h.split("/")[2]]=ev.target.value;route()});
